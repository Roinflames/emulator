services:
  - type: web
    name: pokemon-web
    env: docker
    plan: starter
    region: oregon
    autoDeploy: true
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pokemon-web-db
          property: connectionString
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: ROMS_DIR
        value: /app/roms
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        value: "<replace-with-secure-secret>"

databases:
  - name: pokemon-web-db
    engine: postgres
    version: "16"
    plan: standard-0
    region: oregon
