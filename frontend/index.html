<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Web</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Pokemon Web</h1>
                <p>Juega Pokemon en tu navegador</p>
                <p class="app-version">v<span data-app-version>dev</span></p>
            </div>

            <div class="tab-switcher">
                <button class="tab-btn active" data-tab="login">Iniciar Sesion</button>
                <button class="tab-btn" data-tab="register">Registrarse</button>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-user">Usuario</label>
                    <div class="field-with-icon">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4.42 0-8 2-8 4.5V21h16v-2.5C20 16 16.42 14 12 14z"/>
                        </svg>
                        <input type="text" id="login-user" placeholder="Tu nombre de usuario" required minlength="3">
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-pass">Contrasena</label>
                    <div class="password-field">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path fill="currentColor" d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4zm7 12H7v-8h10z"/>
                        </svg>
                        <input type="password" id="login-pass" placeholder="Tu contrasena" required minlength="4">
                        <button type="button" class="pass-toggle" data-target="login-pass" data-state="hidden" aria-label="Mostrar contrasena" title="Mostrar contrasena">
                            <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
                            </svg>
                            <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path fill="currentColor" d="M2.1 3.51 3.5 2.1l18.4 18.4-1.41 1.41-3.16-3.16A10.9 10.9 0 0 1 12 19c-7 0-10-7-10-7a18.5 18.5 0 0 1 4.31-5.46L2.1 3.51zm8.03 8.03a2.5 2.5 0 0 0 3.33 3.33l-3.33-3.33zM12 7a5 5 0 0 1 5 5c0 .56-.09 1.1-.26 1.6l-2.02-2.02a2.5 2.5 0 0 0-3.3-3.3L9.4 6.26c.5-.17 1.04-.26 1.6-.26zm7.13 6.13A18.2 18.2 0 0 0 22 12s-3-7-10-7c-1.2 0-2.3.2-3.29.53l1.64 1.64c.53-.11 1.08-.17 1.65-.17a5 5 0 0 1 5 5c0 .57-.06 1.12-.17 1.65l2.64 2.64z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
                <p id="login-error" class="error-msg hidden"></p>
            </form>

            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label for="reg-user">Usuario</label>
                    <div class="field-with-icon">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4.42 0-8 2-8 4.5V21h16v-2.5C20 16 16.42 14 12 14z"/>
                        </svg>
                        <input type="text" id="reg-user" placeholder="Elige un nombre" required minlength="3">
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-pass">Contrasena</label>
                    <div class="password-field">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path fill="currentColor" d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4zm7 12H7v-8h10z"/>
                        </svg>
                        <input type="password" id="reg-pass" placeholder="Elige una contrasena" required minlength="4">
                        <button type="button" class="pass-toggle" data-target="reg-pass" data-state="hidden" aria-label="Mostrar contrasena" title="Mostrar contrasena">
                            <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
                            </svg>
                            <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path fill="currentColor" d="M2.1 3.51 3.5 2.1l18.4 18.4-1.41 1.41-3.16-3.16A10.9 10.9 0 0 1 12 19c-7 0-10-7-10-7a18.5 18.5 0 0 1 4.31-5.46L2.1 3.51zm8.03 8.03a2.5 2.5 0 0 0 3.33 3.33l-3.33-3.33zM12 7a5 5 0 0 1 5 5c0 .56-.09 1.1-.26 1.6l-2.02-2.02a2.5 2.5 0 0 0-3.3-3.3L9.4 6.26c.5-.17 1.04-.26 1.6-.26zm7.13 6.13A18.2 18.2 0 0 0 22 12s-3-7-10-7c-1.2 0-2.3.2-3.29.53l1.64 1.64c.53-.11 1.08-.17 1.65-.17a5 5 0 0 1 5 5c0 .57-.06 1.12-.17 1.65l2.64 2.64z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Crear cuenta</button>
                <p id="register-error" class="error-msg hidden"></p>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/version.js"></script>
    <script>
        // Redirect if already logged in
        if (getToken()) {
            window.location.href = '/lobby.html';
        }

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                const login = document.getElementById('login-form');
                const reg = document.getElementById('register-form');
                const show = (tab === 'login') ? login : reg;

                login.classList.toggle('hidden', tab !== 'login');
                reg.classList.toggle('hidden', tab !== 'register');

                show.classList.remove('animate-in');
                // Force reflow so the animation can replay.
                void show.offsetWidth;
                show.classList.add('animate-in');
            });
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');

            try {
                const res = await fetch(API + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('login-user').value,
                        password: document.getElementById('login-pass').value
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.error || 'Error al iniciar sesion';
                    errEl.classList.remove('hidden');
                    errEl.classList.remove('shake');
                    void errEl.offsetWidth;
                    errEl.classList.add('shake');
                    return;
                }
                setAuth(data.token, data.username);
                window.location.href = '/lobby.html';
            } catch {
                errEl.textContent = 'Error de conexion';
                errEl.classList.remove('hidden');
            }
        });

        // Register
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('register-error');
            errEl.classList.add('hidden');

            try {
                const res = await fetch(API + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('reg-user').value,
                        password: document.getElementById('reg-pass').value
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.error || 'Error al registrarse';
                    errEl.classList.remove('hidden');
                    errEl.classList.remove('shake');
                    void errEl.offsetWidth;
                    errEl.classList.add('shake');
                    return;
                }
                setAuth(data.token, data.username);
                window.location.href = '/lobby.html';
            } catch {
                errEl.textContent = 'Error de conexion';
                errEl.classList.remove('hidden');
            }
        });

        // Password show/hide toggles
        document.querySelectorAll('.pass-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.dataset.target;
                const input = document.getElementById(targetId);
                if (!input) return;

                const wasPassword = (input.type === 'password');
                const start = input.selectionStart;
                const end = input.selectionEnd;
                input.type = wasPassword ? 'text' : 'password';

                // Preserve cursor position where supported.
                try { input.setSelectionRange(start, end); } catch {}
                input.focus();

                const nextState = wasPassword ? 'shown' : 'hidden';
                btn.dataset.state = nextState;
                const label = wasPassword ? 'Ocultar contrasena' : 'Mostrar contrasena';
                btn.setAttribute('aria-label', label);
                btn.setAttribute('title', label);

                btn.classList.remove('pulse');
                void btn.offsetWidth;
                btn.classList.add('pulse');
            });
        });
    </script>
</body>
</html>
